# nginx cumple dos roles: sirve la SPA de React y actúa como API gateway hacia los microservicios.

# Rate limiting para endpoints de autenticación (mitiga fuerza bruta: OWASP A07).
limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;

upstream user_service    { server user-service:8080; }
upstream catalog_service { server catalog-service:8080; }
upstream order_service   { server order-service:8080; }

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    # Los endpoints /internal nunca se exponen: el cliente no puede enviar la API key interna.
    proxy_set_header X-Internal-Api-Key "";

    location /api/auth/ {
        limit_req zone=auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://user_service;
    }
    location /api/users/    { proxy_pass http://user_service; }
    location /api/products  { proxy_pass http://catalog_service; }
    location /api/cart      { proxy_pass http://order_service; }
    location /api/orders    { proxy_pass http://order_service; }
    location /api/          { return 404; }

    # Nota: no se usa add_header dentro de los location porque anularía los headers de seguridad de arriba.
    # Archivos con hash en el nombre: caché larga.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Rutas de la SPA (React Router): siempre devolver index.html, sin caché.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
